name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 尾形亀之助 詩篇（『尾形亀之助詩集』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: ogata-kamenosuke-c7fc19c0-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
